<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#B88E44" />
      <stop offset="100%" stop-color="#8A6421" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A8295" />
      <stop offset="50%" stop-color="#2C5F6D" />
      <stop offset="100%" stop-color="#193942" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <g filter="url(#dropShadow)">
    <!-- Modular Cube Top Left -->
    <path d="M 60 45 L 100 25 L 140 45 L 100 65 Z" fill="url(#cyanGrad)" opacity="0.9" />
    <path d="M 60 45 L 100 65 L 100 110 L 60 90 Z" fill="url(#cyanGrad)" opacity="0.75" />
    <path d="M 100 65 L 140 45 L 140 90 L 100 110 Z" fill="url(#cyanGrad)" opacity="1" />

    <!-- Overlapping Gold Geometric Accent (M GM Arch) -->
    <path d="M 100 80 L 145 55 L 180 75 L 135 100 Z" fill="url(#goldGrad)" opacity="0.9" />
    <path d="M 100 80 L 135 100 L 135 150 L 100 130 Z" fill="url(#goldGrad)" opacity="0.8" />
    <path d="M 135 100 L 180 75 L 180 125 L 135 150 Z" fill="url(#goldGrad)" opacity="1" />

    <!-- Bottom Left Modular Block -->
    <path d="M 20 85 L 60 65 L 95 85 L 55 105 Z" fill="url(#goldGrad)" opacity="0.95" />
    <path d="M 20 85 L 55 105 L 55 145 L 20 125 Z" fill="url(#goldGrad)" opacity="0.75" />
    <path d="M 55 105 L 95 85 L 95 125 L 55 145 Z" fill="url(#goldGrad)" opacity="0.9" />
  </g>
</svg>
